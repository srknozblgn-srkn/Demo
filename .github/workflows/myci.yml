name: CI
 
on:
  push:
  pull_request:
 
permissions:
  contents: read
  pull-requests: write
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Build
        run: python -m compileall .
 
  test:
    needs: build
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Run tests
        run: pytest --tb==short -q 2>&1 | tee test-output.txt
      - name: Publish test report
        if: always()
        run: |
         echo "### Test Results" >> $GITHUB_STEP_SUMMARY
         cat test-output.txt >> $GITHUB_STEP_SUMMARY
  
  ai-review:
   runs-on: ubuntu-latest
   needs: test
   if: github.event_name == 'pull_request'
   steps:
     - name: Checkout code
       uses: actions/checkout@v4
     - name: AI Code Review
       uses: freeedcom/ai-codereviewer@main
       with:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
         OPENAI_API_MODEL: "gpt-4o"
         exclude: " *.md,*.txt"
         
  security:
    runs-on: ubuntu-latest
    needs: test
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Scan dependencies
        run: |
          pip install pip-audit
          pip-audit
 
  static-analysis:
    needs: test
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Run static analysis
        run: |
          pip install bandit
          bandit -r . -ll
 
  docker:
    needs:
      - security
      - static-analysis
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Build Docker image
        run: docker build -t devops-demo:${{ github.sha }} .
 
      - name: Run application inside container
        run: docker run --rm devops-demo:${{ github.sha }}
